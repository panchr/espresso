name: Release

on:
  push:
    tags: ['v*']
  # Lets an already-tagged release be rebuilt or republished — notably to push
  # the cask for a release cut before the tap credential existed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Only whether the secret exists, not its value: a job-level secret would
      # be in the environment of every step, including third-party actions.
      # TAP_DEPLOY_KEY is an SSH deploy key with write access to the tap repo
      # and nothing else; without it the tap step is skipped and the release
      # still succeeds.
      HAS_TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY != '' }}
      TAP_REPO: panchr/homebrew-tap
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Test
        run: make test

      - name: Build universal app bundle
        run: make dist ARCHS="arm64 x86_64" VERSION="${TAG}"

      # A silently single-arch release would only fail on the Intel Macs we
      # have no way to test on.
      - name: Verify both architectures are present
        run: |
          lipo -info Espresso.app/Contents/MacOS/Espresso
          lipo -info Espresso.app/Contents/MacOS/Espresso | grep -q x86_64
          lipo -info Espresso.app/Contents/MacOS/Espresso | grep -q arm64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "${RUNNER_TEMP}/notes.md" <<'EOF'
          ## Install

          ```sh
          brew install --cask panchr/tap/espresso
          ```

          ```sh
          curl -fsSL https://raw.githubusercontent.com/panchr/espresso/main/install.sh | bash
          ```

          Or download `Espresso.zip` below, unzip it into `/Applications`, and run
          `xattr -dr com.apple.quarantine /Applications/Espresso.app` — the app is
          ad-hoc signed rather than notarized, so Gatekeeper blocks it otherwise.
          EOF

          # A re-run exists to publish the cask for an already-released tag, so
          # it must leave the published archive alone: builds are not
          # reproducible, and re-uploading would invalidate the bytes anyone has
          # already downloaded. Pull the published checksum instead, so the cask
          # is stamped from what users actually get.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already published — reusing its assets"
            gh release download "${TAG}" \
              --pattern 'Espresso.zip.sha256' \
              --dir dist \
              --clobber
          else
            gh release create "${TAG}" \
              dist/Espresso.zip \
              dist/Espresso.zip.sha256 \
              --title "${TAG}" \
              --generate-notes \
              --notes "$(cat "${RUNNER_TEMP}/notes.md")"
          fi

      # The cask can only point at an artifact that already exists, so this
      # runs after the release is published.
      - name: Update Homebrew tap
        if: env.HAS_TAP_KEY == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version="${TAG#v}"
          sha="$(cut -d' ' -f1 dist/Espresso.zip.sha256)"

          key="${RUNNER_TEMP}/tap_deploy_key"
          printf '%s\n' "${TAP_DEPLOY_KEY}" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --quiet "git@github.com:${TAP_REPO}.git" "${RUNNER_TEMP}/tap"
          mkdir -p "${RUNNER_TEMP}/tap/Casks"

          # Drop the placeholder header; stamp in the version and checksum of
          # the archive just published.
          awk 'f || /^cask "/{f=1; print}' Casks/espresso.rb \
            | sed -e "s|^  version .*|  version \"${version}\"|" \
                  -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
            > "${RUNNER_TEMP}/tap/Casks/espresso.rb"

          grep -q "version \"${version}\"" "${RUNNER_TEMP}/tap/Casks/espresso.rb"
          grep -q "sha256 \"${sha}\"" "${RUNNER_TEMP}/tap/Casks/espresso.rb"

          cd "${RUNNER_TEMP}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/espresso.rb
          git diff --cached --quiet || git commit -m "espresso ${version}"
          git push

      - name: Note skipped tap update
        if: env.HAS_TAP_KEY != 'true'
        run: echo "::notice::TAP_DEPLOY_KEY is not set — skipping the Homebrew tap update"
