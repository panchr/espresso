name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Assemble app bundle
        run: make app
      - name: Verify bundle launches as a menubar app
        run: |
          plutil -lint Espresso.app/Contents/Info.plist
          codesign --verify --verbose Espresso.app

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint installer
        run: shellcheck install.sh
